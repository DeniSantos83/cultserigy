[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://hbitdsawyuppzmksdffn.supabase.co; connect-src 'self' https://hbitdsawyuppzmksdffn.supabase.co wss://hbitdsawyuppzmksdffn.supabase.co; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
